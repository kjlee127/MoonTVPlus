name = "moontv-plus"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
main = "./cloudflare-worker.ts"
minify = true
keep_vars = true

# 静态资源配置
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 数据库绑定：保持现有数据库 ID，由 GitHub Actions secret 注入
[[d1_databases]]
binding = "DB"
database_name = "moontvplus"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 内部观影室 Durable Object
[[durable_objects.bindings]]
name = "WATCH_ROOM"
class_name = "WatchRoomHub"

# 首次注册观影室 DO；如果 v1 已应用，Wrangler 会识别并跳过
[[migrations]]
tag = "v1"
new_sqlite_classes = ["WatchRoomHub"]

# 非敏感运行时配置；敏感的 CRON_PASSWORD 已单独存为 Cloudflare Secret
[vars]
WATCH_ROOM_ENABLED = "true"
WATCH_ROOM_SERVER_TYPE = "internal"
CRON_WAIT_FOR_COMPLETION = "true"
CRON_USER_BATCH_SIZE = "3"
